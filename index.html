<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Instalador APK · Código Único</title>
    <style>
        /* ===== RESET Y ESTILOS BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0e1a;
            /* Fondo oscuro como tu diseño actual */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        /* ===== TARJETA PRINCIPAL ===== */
        .card {
            background: #1a1a2e;
            /* Fondo oscuro elegante */
            border-radius: 32px;
            padding: 40px 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            color: #e8e8e8;
        }

        .icono-grande {
            text-align: center;
            font-size: 56px;
            margin-bottom: 6px;
            display: block;
        }

        h1 {
            color: #ffffff;
            font-size: 26px;
            text-align: center;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }

        .subtitulo {
            color: #a0a0b8;
            text-align: center;
            font-size: 15px;
            margin-bottom: 28px;
            font-weight: 400;
        }

        /* ===== INPUT Y BOTÓN ===== */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #2a2a44;
            border-radius: 14px;
            font-size: 16px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            background: #12121f;
            color: #ffffff;
            outline: none;
        }

        input::placeholder {
            color: #555570;
            letter-spacing: 0.5px;
            font-weight: 400;
        }

        input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.15);
            background: #16162b;
        }

        input:disabled {
            opacity: 0.4;
            background: #1a1a2e;
            cursor: not-allowed;
        }

        button {
            padding: 14px 22px;
            background: #6c63ff;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
            min-width: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover:not(:disabled) {
            background: #7b73ff;
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.3);
        }

        button:active:not(:disabled) {
            transform: scale(0.96);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== MENSAJES ===== */
        #mensaje {
            min-height: 46px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 18px;
            display: none;
            transition: all 0.3s;
            text-align: center;
        }

        #mensaje.exito {
            display: block;
            background: rgba(46, 213, 115, 0.15);
            color: #7ddfa0;
            border: 1px solid rgba(46, 213, 115, 0.2);
        }

        #mensaje.error {
            display: block;
            background: rgba(255, 71, 87, 0.12);
            color: #ff6b7a;
            border: 1px solid rgba(255, 71, 87, 0.2);
        }

        #mensaje.info {
            display: block;
            background: rgba(108, 99, 255, 0.1);
            color: #a8a2ff;
            border: 1px solid rgba(108, 99, 255, 0.15);
        }

        /* ===== INFORMACIÓN ADICIONAL ===== */
        .info-adicional {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .info-adicional details {
            color: #8888aa;
            font-size: 14px;
            cursor: pointer;
        }

        .info-adicional details summary {
            font-weight: 600;
            color: #b0b0cc;
            padding: 4px 0;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-adicional details summary::-webkit-details-marker {
            display: none;
        }

        .info-adicional details ul {
            margin-top: 10px;
            padding-left: 22px;
            line-height: 2;
            list-style: none;
        }

        .info-adicional details ul li::before {
            content: "• ";
            color: #6c63ff;
            font-weight: bold;
        }

        .info-adicional details ul li strong {
            color: #c8c8e8;
        }

        /* ===== FOOTER ===== */
        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
            margin-top: 20px;
            font-size: 11px;
            letter-spacing: 0.8px;
        }

        footer span {
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .card {
                padding: 28px 16px;
            }
            .input-group {
                flex-direction: column;
            }
            button {
                width: 100%;
                justify-content: center;
                min-width: unset;
                padding: 15px;
            }
            h1 {
                font-size: 22px;
            }
            .icono-grande {
                font-size: 44px;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 20px 12px;
            }
            input {
                font-size: 14px;
                padding: 12px 12px;
            }
            button {
                font-size: 15px;
                padding: 13px;
            }
        }

        /* ===== SPINNER DE CARGA ===== */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: girar 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== ANIMACIÓN DE ENTRADA ===== */
        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .card {
            animation: aparecer 0.5s ease-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">

            <!-- ÍCONO PRINCIPAL (cambia según estado) -->
            <span class="icono-grande" id="iconoPrincipal">📦</span>

            <!-- TÍTULO Y SUBTÍTULO -->
            <h1 id="tituloPrincipal">Instalador</h1>
            <p class="subtitulo" id="subtituloPrincipal">Ingresa el código de instalación que recibiste.<br />Código de un solo uso.</p>

            <!-- INPUT + BOTÓN -->
            <div class="input-group">
                <input type="text" id="codigoInput" placeholder="Ej: A3F5D-2E1K-9M7N" maxlength="20" autofocus />
                <button id="botonInstalar">🔓 Instalar</button>
            </div>

            <!-- ÁREA DE MENSAJES -->
            <div id="mensaje"></div>

            <!-- INFORMACIÓN ADICIONAL (colapsable) -->
            <div class="info-adicional">
                <details>
                    <summary>📋 Información</summary>
                    <ul>
                        <li><strong>Código válido</strong> para un solo uso</li>
                        <li>La app se instalará directamente desde el navegador</li>
                        <li>No se guardará el archivo APK en tu dispositivo</li>
                    </ul>
                </details>
            </div>

        </div>

        <footer>
            <span>🔐 Código de un solo uso · v2.0</span>
        </footer>
    </div>

    <script>
        // ============================================================
        //  CONFIGURACIÓN - ¡AJUSTA ESTO!
        // ============================================================
        const CONFIG = {
            // --- LISTA DE CÓDIGOS VÁLIDOS ---
            // Formato: { code: 'CÓDIGO', apk: 'nombre-del-archivo.apk' }
            // ¡IMPORTANTE! Cambia 'tu-app.apk' por el nombre real de tu APK
            CODIGOS_VALIDOS: [
                { code: 'A3F5D-2E1K-9M7N', apk: 'inventario_v1_0_0.apk' },
                { code: 'B8G7H-4P3L-6R2Q', apk: 'tu-app.apk' },
                { code: 'C9J8K-7S5D-1T4F', apk: 'tu-app.apk' }
            ],

            // --- URL DE TU APK (GITHUB RAW) ---
            // Si tu APK está en la raíz del repo, usa esta URL base
            // y el script añadirá el nombre del archivo automáticamente
            URL_BASE_APK: 'https://raw.githubusercontent.com/desarrolloweb-rgsoria/Servidor-apk/main/',

            // --- CLAVE PARA localStorage (códigos usados) ---
            CLAVE_STORAGE: 'codigos_usados_apk'
        };

        // ============================================================
        //  LÓGICA DEL SISTEMA
        // ============================================================

        // Obtener códigos ya usados
        function obtenerUsados() {
            try {
                const data = localStorage.getItem(CONFIG.CLAVE_STORAGE);
                return data ? JSON.parse(data) : [];
            } catch {
                return [];
            }
        }

        // Guardar código como usado
        function marcarUsado(code) {
            const usados = obtenerUsados();
            if (!usados.includes(code)) {
                usados.push(code);
                localStorage.setItem(CONFIG.CLAVE_STORAGE, JSON.stringify(usados));
            }
        }

        // Validar código
        function validarCodigo(input) {
            const limpio = input.toUpperCase().trim().replace(/\s/g, '');

            // ¿Ya fue usado?
            if (obtenerUsados().includes(limpio)) {
                return { valido: false, mensaje: '❌ El código ya fue utilizado' };
            }

            // Buscar en la lista
            const encontrado = CONFIG.CODIGOS_VALIDOS.find(c => c.code === limpio);
            if (!encontrado) {
                return { valido: false, mensaje: '❌ Código no válido' };
            }

            return { valido: true, apk: encontrado.apk };
        }

        // Iniciar descarga del APK
        function descargarAPK(nombreArchivo) {
            const url = CONFIG.URL_BASE_APK + nombreArchivo;
            const link = document.createElement('a');
            link.href = url;
            link.download = nombreArchivo;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            setTimeout(() => document.body.removeChild(link), 1500);
        }

        // Mostrar mensaje en la interfaz
        function mostrarMensaje(texto, tipo = 'info') {
            const el = document.getElementById('mensaje');
            el.textContent = texto;
            el.className = 'mensaje ' + tipo;
            clearTimeout(window.timerMensaje);
            if (tipo !== 'error') {
                window.timerMensaje = setTimeout(() => {
                    el.className = 'mensaje';
                }, 6000);
            }
        }

        // Cambiar UI según estado (ícono, título, subtítulo)
        function cambiarUI(estado) {
            const icono = document.getElementById('iconoPrincipal');
            const titulo = document.getElementById('tituloPrincipal');
            const subtitulo = document.getElementById('subtituloPrincipal');

            switch (estado) {
                case 'inicio':
                    icono.textContent = '📦';
                    titulo.textContent = 'Instalador';
                    subtitulo.textContent = 'Ingresa el código de instalación que recibiste. Código de un solo uso.';
                    break;
                case 'exito':
                    icono.textContent = '✅';
                    titulo.textContent = '¡Instalación iniciada!';
                    subtitulo.textContent = 'La app se está instalando en tu dispositivo.';
                    break;
                case 'error':
                    icono.textContent = '🔒';
                    titulo.textContent = 'No autorizado';
                    subtitulo.textContent = 'El código no es válido o ya fue utilizado.';
                    break;
                default:
                    break;
            }
        }

        // Resetear UI a estado inicial
        function resetearUI() {
            const btn = document.getElementById('botonInstalar');
            const input = document.getElementById('codigoInput');
            btn.disabled = false;
            btn.innerHTML = '🔓 Instalar';
            input.disabled = false;
            input.value = '';
            input.focus();
            cambiarUI('inicio');
            document.getElementById('mensaje').className = 'mensaje';
        }

        // ============================================================
        //  EVENTO PRINCIPAL: CLICK EN INSTALAR
        // ============================================================
        document.getElementById('botonInstalar').addEventListener('click', function() {
            const input = document.getElementById('codigoInput');
            const codigo = input.value;
            const btn = this;

            if (!codigo.trim()) {
                mostrarMensaje('⚠️ Ingresa el código de instalación', 'error');
                input.focus();
                return;
            }

            // Deshabilitar y mostrar carga
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Validando...';

            // Delay para feedback visual
            setTimeout(() => {
                const resultado = validarCodigo(codigo);

                if (!resultado.valido) {
                    mostrarMensaje(resultado.mensaje, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '🔓 Instalar';
                    cambiarUI('error');
                    input.focus();
                    input.select();
                    return;
                }

                // ✅ ÉXITO
                mostrarMensaje('✅ Código verificado. Iniciando descarga...', 'exito');
                marcarUsado(codigo.toUpperCase().trim());
                descargarAPK(resultado.apk);
                cambiarUI('exito');

                btn.innerHTML = '✅ Descargando...';
                input.disabled = true;

                // Resetear después de 10s
                setTimeout(() => {
                    resetearUI();
                    mostrarMensaje('💡 La descarga debería comenzar automáticamente', 'info');
                }, 10000);

            }, 800);
        });

        // ============================================================
        //  SOPORTE PARA TECLA ENTER
        // ============================================================
        document.getElementById('codigoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('botonInstalar').click();
            }
        });

        // ============================================================
        //  AUTO-FOCUS AL CARGAR
        // ============================================================
        window.addEventListener('load', function() {
            document.getElementById('codigoInput').focus();
            console.log('🔐 Instalador APK cargado');
            console.log(`📦 ${CONFIG.CODIGOS_VALIDOS.length} códigos disponibles`);
            console.log(`🔢 ${obtenerUsados().length} códigos ya usados`);
        });

        // ============================================================
        //  (OPCIONAL) GENERADOR DE CÓDIGOS - desde consola
        //  Escribe en consola: generarCodigos(5)
        // ============================================================
        window.generarCodigos = function(cantidad = 5) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const codes = [];
            for (let i = 0; i < cantidad; i++) {
                let rand = '';
                for (let j = 0; j < 13; j++) {
                    rand += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                codes.push({
                    code: `${rand.slice(0,5)}-${rand.slice(5,10)}-${rand.slice(10,13)}`,
                    apk: 'tu-app.apk' // Cambia si tienes varias versiones
                });
            }
            console.log('📋 Códigos generados:');
            console.log(JSON.stringify(codes, null, 2));
            console.log('\n📌 Copia en CONFIG.CODIGOS_VALIDOS');
            return codes;
        };

        console.log('💡 Para generar códigos: generarCodigos(10)');
    </script>

</body>
    </html>
